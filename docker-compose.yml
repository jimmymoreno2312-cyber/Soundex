services:

  mysql:
    image: mysql:8.0
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: musicdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend

    ports:
      - "5001:5001"

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql
      DB_USER: appuser
      DB_PASSWORD: password
      DB_NAME: musicdb

  frontend:
    build: .

    ports:
      - "3000:5173"

    depends_on:
      - backend

volumes:
  mysql_data:
