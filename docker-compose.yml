services:
  backend:
    build: ./backend

    ports:
      - "5001:5001"

    environment:
      MYSQL_HOST: ${RAILWAY_MYSQL_HOST}
      MYSQL_PORT: ${RAILWAY_MYSQL_PORT}
      MYSQL_USER: ${RAILWAY_MYSQL_USER}
      MYSQL_PASSWORD: ${RAILWAY_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${RAILWAY_MYSQL_DATABASE}

  frontend:
    build: .

    ports:
      - "3000:5173"

    depends_on:
      - backend
